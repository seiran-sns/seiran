name: seiran-e2e

# E2Eテスト専用のPostgres。手動開発用の db コンテナ（docker-compose.mono.yml、ポート5432）
# とは別インスタンス・別ポートで動かし、テスト実行のたびに空の状態から始める
# （global-teardown.ts で `down -v` してデータを破棄する）。
services:
  db:
    # pg_bigm 組み込み済みイメージ（../docker/Dockerfile.postgres, #97）。
    # migrate時に `CREATE EXTENSION pg_bigm` を実行するため、素の postgres:16-alpine では
    # 拡張が見つからず失敗する。
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    image: seiran-postgres:16-pgbigm
    command: ["postgres", "-c", "shared_preload_libraries=pg_bigm"]
    restart: "no"
    environment:
      POSTGRES_USER: seiran_e2e
      POSTGRES_PASSWORD: seiran_e2e
      POSTGRES_DB: seiran_e2e
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seiran_e2e -d seiran_e2e"]
      interval: 1s
      retries: 30
