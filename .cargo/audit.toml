# cargo-audit / rustsec/audit-check（CI）の設定（docs/code_audit_2026-08-05.md S-9）。
#
# 現時点で修正版が存在しない、または修正に大きな依存アップグレードを要する既知の
# advisoryを一時的に無視する。新規に混入する脆弱性はここに無いものだけがCIを
# 落とすため、監視自体は機能する。無視した項目は定期的に見直すこと。
[advisories]
ignore = [
    # rsa: Marvin Attack（タイミングサイドチャネル）。修正版が存在しない
    # （2026-08-05時点）。seiran-common がAP HTTP SignaturesのRSA-SHA256署名に
    # 使用しており、フェディバース標準に合わせるための直接依存で代替が無い。
    "RUSTSEC-2023-0071",
    # rustls-webpki 0.101.7: aws-sdk-s3 経由の rustls 0.21系に固定されており、
    # 解消には aws-sdk-s3 の大きなメジャーアップグレードが必要（S3ストレージ
    # プロバイダのコードに影響しうる）。ワイルドカード証明書名・URI名の検証と
    # CRL解析の問題で、outbound専用のS3クライアント用途では悪用経路が乏しい。
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27: aws-smithy-http-client経由のhyper 0.14系（aws-sdk-s3のレガシー
    # クライアント）に固定されており、単純な`cargo update`では上がらない
    # （aws-sdk-s3側のクライアント実装切り替えを要する大きめの変更になる）。
    # 空DATA frame無制限受理によるDoS。outbound専用のS3クライアント用途
    # （信頼済みのAWSエンドポイントへの発信のみ、不特定多数からのHTTP/2受信は
    # 経由しない）では悪用経路が乏しい。h2 0.4系（他の依存経路）は
    # 0.4.18へ更新済み。
    "RUSTSEC-2026-0258",
]
