[package]
name = "seiran-common"
version.workspace = true
edition = "2021"

[dependencies]
tracing = "0.1"
sqlx = { version = "0.8", features = [ "runtime-tokio", "postgres", "chrono", "uuid", "macros" ] }
tokio = { version = "1", features = ["full", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
async-trait = "0.1"
argon2 = "0.5"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
hickory-resolver = "0.26.3"
bytes = "1"
base64 = "0.22"
toml = "1.1.2"
p256 = { version = "0.14.0", features = ["pkcs8", "pem", "getrandom"] }
hex = "0.4.3"
thiserror = "2.0.18"
url = "2.5.8"
urlencoding = "2.1.3"
ammonia = "4"
rsa = { version = "0.9.10", features = ["sha2", "pem"] }
sha2 = "0.10"
serde_ipld_dagcbor = "0.6"
serde_bytes = "0.11"
ipld-core = "0.4"
cid = "0.11"
multihash = "0.19"
bs58 = "0.5"
base32 = "0.4"
aes-gcm = "0.10"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
image = { version = "0.25", features = ["webp", "jpeg", "png"] }
img-parts = "0.4"
blurhash = "0.2"
zstd = "0.14"
infer = "0.16"
html-escape = "0.2"
encoding_rs = "0.8"
regex = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio-util = "0.7"
futures-util = "0.3"
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }

[build-dependencies]
toml = "1.1.2"
