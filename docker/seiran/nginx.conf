# イメージ内の nginx（`all` と `frontend` の役割で動く）。サイトの設定は起動時に
# site.conf.template から生成する（docker/seiran/entrypoint.sh）。
user seiran;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
# 停止（nginx -s quit）のとき、WebSocket 等の長い接続を待ち続けない。
worker_shutdown_timeout 30s;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    # リクエストのログは seiran-server が出す（パスだけを記録し、クエリのトークンを残さない）。
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }
    # 前段（LB・Cloudflare）が付けた値を引き継ぐ。無ければ自分が受けた scheme。
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    include /etc/nginx/conf.d/*.conf;
}
