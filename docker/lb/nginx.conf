# docker-compose.prod.yml の LB。すべてのリクエストを、動いている方の色（seiran-blue /
# seiran-green）にだけ流す。向き先は active.conf（scripts/deploy.sh が書き換えて reload する）。
# reload は graceful で、古いワーカーは処理中のリクエストを最後まで流し、新しいワーカーは
# 新しい向き先にだけ流すので、切り替えでリクエストを落とさない。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# 前段（Cloudflare）が付けた値を引き継ぐ。無ければ自分が受けた scheme。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;

    # Docker 内部 DNS。コンテナを作り直して IP が変わっても追従する。
    resolver 127.0.0.11 valid=10s ipv6=off;
    # $seiran_backend を定義する（例: set $seiran_backend seiran-green:80;）
    include /etc/nginx/seiran/active.conf;

    # 本文の上限は色の中の nginx がパスごとに決める（ドライブは 100MB）。
    client_max_body_size 100m;
    access_log off;

    location / {
        proxy_pass http://$seiran_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # クライアントIPはバックエンドが X-Forwarded-For を右からたどって決めるので、
        # 受けた接続元（cloudflared など）を末尾に追記するだけにする。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # WebSocket（ストリーミング・subscribeRepos）を切らない
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
