<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- サイトアイコン（#42）。backend が site_icon_url へリダイレクトする。 -->
    <link rel="icon" href="/favicon.ico" />
    <!-- PWA Web App Manifest。backend がサイト設定から動的生成する。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>seiran</title>
    <!-- ダークモード（#127）。React マウント前に data-theme を確定させ、初期表示のちらつきを防ぐ。 -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("seiran_theme");
          var theme =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
