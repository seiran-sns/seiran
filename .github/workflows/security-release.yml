name: Security release

# Dependabot のセキュリティ更新が main に入って CI が通ったら、リビジョン桁を上げて main へ
# push する。その push の CI（ci.yml の image-build・image-publish）が公開イメージを出す。
# 判断と版上げは .github/scripts/security-bump.sh。
#
# 版上げを PR に含めずマージ後にここで直列に行うのは、複数の修正 PR が同時に来たときに
# 版の行で衝突させないため。push は GitHub App のトークンで行う（GITHUB_TOKEN の push では
# main の CI が起動しない。App は main のルールセットの例外にしておく）。
#
# auto-merge（squash。コミットの作者が Dependabot のまま）で入った修正は自動で版を上げる。
# 人がマージした Dependabot の PR（勧告に紐づかない更新等、auto-merge の対象外のもの）は、版上げの
# ジョブを Environment security-release-review の承認待ちにする。飛ばしてしまうと版上げを
# 忘れても気づけないため。承認すれば同じ手順で版を上げる（Environment に必須の承認者を設定しておく）。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: security-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # auto: auto-merge で入った修正、review: 人がマージした Dependabot の PR、none: それ以外
  classify:
    name: Classify
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
              mode=auto
          elif gh api "repos/$REPO/commits/$SHA/pulls" \
                  --jq '.[] | select(.merged_at != null) | .user.login' | grep -qx 'dependabot\[bot\]'; then
              mode=review
          else
              mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "$SHA: $mode" >> "$GITHUB_STEP_SUMMARY"

  bump:
    name: Bump revision
    needs: classify
    if: needs.classify.outputs.mode == 'auto' || needs.classify.outputs.mode == 'review'
    # Environment は式で空にできないので、自動のときは承認者の無い security-release を使う
    environment: ${{ needs.classify.outputs.mode == 'review' && 'security-release-review' || 'security-release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Configure git author
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Bump and push
        env:
          FIXED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: .github/scripts/security-bump.sh "$FIXED_SHA"
