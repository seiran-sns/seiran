name: Dependency audit

# 依存の勧告はコードを変えなくても後から出るので、push 時の CI とは別に8時間ごとに検査する。
# Rust は RustSec、フロントは本番依存だけ（ci.yml と同じ基準）。修正版のある勧告は
# Dependabot のセキュリティ更新が PR にし、dependabot-auto-merge.yml・security-release.yml が
# リリースまで進める。ここで落ちたまま残るのは、修正版が無いか Dependabot が直せないもの。
on:
  schedule:
    - cron: "17 */8 * * *" # 8時間ごと（JST 1:17・9:17・17:17）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write # schedule で起動したときは、勧告ごとに Issue を立てる
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
