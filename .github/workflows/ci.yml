name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── 検査の要否の判定 ────────────────────────────────────────────────────
  # 検査ジョブごとに検査対象のファイル群の指紋を取り、同じ指紋で通った記録（各ジョブが最後に
  # 残すアーティファクト ci-pass-<ジョブ>-<指紋>、7日保存）があればそのジョブをスキップする
  # （.github/scripts/ci-changes.sh）。PR で通った中身が main に入っても、版上げだけの
  # コミットでも、検査をやり直さない。
  # ワークフローごと paths で絞らないのは、必須チェックに指定したジョブが報告されないと
  # 「未着」として扱われ、マージ（auto-merge を含む）が止まるため。ジョブの if でスキップ
  # した場合は skipped が報告され、必須チェックを満たす。
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 通った記録（アーティファクト）を探す
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      rust_fp: ${{ steps.changes.outputs.rust_fp }}
      frontend_fp: ${{ steps.changes.outputs.frontend_fp }}
      e2e_fp: ${{ steps.changes.outputs.e2e_fp }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide which checks to run
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/ci-changes.sh

  # ─── シークレット検出 ────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  # ─── Rust: 型チェック / Clippy / テスト ─────────────────────────────────
  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `stable`任せだとRustリリースのたびにclippyの新規lintが追加され、
          # コード変更なしにCIが突然落ちることがある（実機確認: result_large_err
          # lintが新しいstableで有効化され既存コード6箇所が引っかかった）。
          # 明示的にバージョンを固定し、更新は意図した時にだけ行う。
          toolchain: "1.96.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # e2eジョブと依存クレートのビルド成果物を共有する（e2e側はsave-if:falseで
          # 読み取り専用にし、保存はこちらに一本化する。同一キーへの保存はGitHub
          # Actionsキャッシュの仕様上「先勝ち」で、両方保存にすると後発ジョブの
          # 保存が反映されず、キャッシュの中身がジョブ間で行ったり来たりする）。
          shared-key: "ci-rust"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Type check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # cargo audit を直接使う（版は audit.yml と揃える）。勧告があれば終了コードで落ちる。
      # 結果を GitHub のチェックとして書き込むアクションは、PR の実行でチェックの更新に
      # 失敗してジョブを落とすことがあるので使わない。
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.23.0
      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Test
        run: cargo test --workspace
      # 同じ中身なら次から省けるよう、通った記録を残す（.github/scripts/ci-changes.sh）
      - name: Record pass
        uses: actions/upload-artifact@v7
        with:
          name: ci-pass-rust-${{ needs.changes.outputs.rust_fp }}
          path: .github/workflows/ci.yml
          retention-days: 7
          overwrite: true

  # ─── フロントエンド: 型チェック / ESLint ────────────────────────────────
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        # 配布するバンドルに入る本番依存だけを検査する。開発用依存（vite・vitest・eslint 等）は
        # ビルド・テスト時にしか動かず外部入力も渡らないので、その勧告で CI を止めない。
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm test
      # 同じ中身なら次から省けるよう、通った記録を残す（.github/scripts/ci-changes.sh）
      - name: Record pass
        uses: actions/upload-artifact@v7
        with:
          name: ci-pass-frontend-${{ needs.changes.outputs.frontend_fp }}
          path: .github/workflows/ci.yml
          retention-days: 7
          overwrite: true

  # ─── ブラウザE2E: 実API + 隔離DB + 外部サービスstub ────────────────────
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rustジョブと同じバージョンに固定する（上記コメント参照）。
          toolchain: "1.96.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust"
          save-if: "false" # 保存はrustジョブに一本化（上記コメント参照）
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: e2e
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build E2E Postgres image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.postgres
          tags: seiran-postgres:16-pgbigm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true # buildxのコンテナドライバはデフォルトでdockerデーモンに載せないため必須
      - name: DB integration tests
        # `crates/seiran-api/tests/*_integration.rs`（`#[ignore]`付き、実DBが必要）を、E2Eと同じ
        # 専用DBで実行する。ハーネスがマイグレーション適用・テストユーザー作成まで行う。
        env:
          POSTGRES_USER: seiran_e2e
          POSTGRES_PASSWORD: seiran_e2e
          POSTGRES_DB: seiran_e2e
          DB_HOST: localhost
          DB_PORT: "5433"
          LOCAL_DOMAIN: localhost
        run: |
          docker compose -f e2e/docker-compose.yml up -d --wait
          cargo test -p seiran-api --tests -- --ignored
      - name: Reset E2E database
        # E2E は空のDBから始める前提のため、結合テストで使ったDBを破棄する。
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
      - name: Build backend binary
        run: cargo build -p seiran-server
        # webServerのtimeout(600s)内でビルドが走る現状だと、ビルド失敗とサーバー起動
        # 失敗の切り分けがCIログ上でしづらい。ここで明示的にビルドしてから
        # npm testに進むことで、失敗ステップの意味を明確にする。
      - name: Run E2E
        working-directory: e2e
        run: npm test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      # 同じ中身なら次から省けるよう、通った記録を残す（.github/scripts/ci-changes.sh）
      - name: Record pass
        uses: actions/upload-artifact@v7
        with:
          name: ci-pass-e2e-${{ needs.changes.outputs.e2e_fp }}
          path: .github/workflows/ci.yml
          retention-days: 7
          overwrite: true

  # ─── 公開イメージ: 検査と並行してビルドし、全部通ったら push ─────────────
  # main への push（と手動実行）のときだけ。同じ版のタグが両方のレジストリに既にあれば
  # ビルドしない。linux/amd64 と linux/arm64 を、それぞれのアーキテクチャのランナーでネイティブに
  # ビルドする（QEMU のエミュレーションでは Rust のリリースビルドが何倍も遅くなるため）。
  #
  #   image-build    検査の結果を待たずにアーキテクチャごとにビルドし、キャッシュ（gha）に置く。
  #                  ビルドしたイメージの OS パッケージを Trivy で検査し、修正版のある脆弱性が
  #                  あれば実行環境の段（runtime）だけキャッシュを使わずに1度だけ作り直す
  #   image-push     全ジョブ成功後に、同じビルドをキャッシュから再現して digest だけで push する
  #   image-publish  2つのアーキテクチャのイメージを1つにまとめて版のタグを付け、git タグを付ける
  #
  # キャッシュが消えていても作り直すだけで、検査を通っていないイメージが出ることはない。
  # 必要なシークレット: DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（seiranorg へ push できるトークン）。
  # GHCR は GITHUB_TOKEN で push する。
  image-build:
    name: Image build (${{ matrix.arch }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      build: ${{ steps.targets.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing tags
        id: targets
        run: .github/scripts/image-targets.sh
      - uses: docker/setup-buildx-action@v4
        if: steps.targets.outputs.build == 'true'
      # Trivy で検査するためにランナーの docker に載せる
      - name: Build
        if: steps.targets.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/seiran/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: seiran-scan:${{ matrix.arch }}
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,scope=release-image-${{ matrix.arch }},mode=max
      - uses: ./.github/actions/setup-trivy
        if: steps.targets.outputs.build == 'true'
      # 検査できなかったとき（データベースの取得失敗等）は作り直さずに進める。リリースは止めない
      # （止めても、公開中の古いイメージのほうが新しくなるわけではない）。
      - name: Scan OS packages
        id: scan
        if: steps.targets.outputs.build == 'true'
        run: .github/scripts/image-vulns.sh "seiran-scan:${{ matrix.arch }}" "$RUNNER_TEMP/vulns.tsv" || true
      # 修正版のある脆弱性が残っているのは、apt の層がキャッシュから再利用され、その後に出た
      # Debian のセキュリティ更新を取り込んでいないため。実行環境の段だけキャッシュを外し、
      # ベースイメージも取り直して作り直す。結果はキャッシュへ書き戻し、image-push がそこから
      # 再現する。作り直した後は検査しない（それでも残るものは Debian 側の修正待ちで、
      # 何度作り直しても変わらない）。
      - name: Rebuild the runtime stage without cache
        if: steps.scan.outputs.found == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/seiran/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=cacheonly
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,scope=release-image-${{ matrix.arch }},mode=max

  image-push:
    name: Image push (${{ matrix.arch }})
    needs: [changes, gitleaks, rust, frontend, e2e, image-build]
    # 検査ジョブは変更範囲によってスキップされる。既定では needs のどれかが skipped だと
    # このジョブもスキップされてしまうので、失敗・キャンセルが無いことを条件にする。
    if: >-
      always() &&
      needs.image-build.outputs.build == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # GHCR への push
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing tags
        id: targets
        run: .github/scripts/image-targets.sh
      - uses: docker/setup-buildx-action@v4
        if: steps.targets.outputs.build == 'true'
      # タグは付けず digest だけで両方のレジストリへ push する（タグは image-publish が
      # 2つのアーキテクチャをまとめてから付ける）。タグの無い digest は、どの版も指さない。
      - name: Push by digest
        id: push
        if: steps.targets.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/seiran/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: |
            docker.io/seiranorg/seiran
            ghcr.io/seiran-sns/seiran
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ steps.targets.outputs.version }}
            org.opencontainers.image.revision=${{ steps.targets.outputs.revision }}
            org.opencontainers.image.source=https://github.com/seiran-sns/seiran
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
      - name: Save digest
        if: steps.targets.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$DIGEST" > "$RUNNER_TEMP/digest/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        if: steps.targets.outputs.build == 'true'
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          retention-days: 1
          overwrite: true

  image-publish:
    name: Image publish
    needs: image-push
    if: >-
      always() &&
      needs.image-push.result == 'success'
    runs-on: ubuntu-latest
    # 同じ版を2つのコミットが同時に出さないよう直列にする（後発は下で既存と判定される）
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: write # git タグ v<版> の push
      packages: write # GHCR への push
    outputs:
      published: ${{ steps.targets.outputs.build }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # image-push の後に別のコミットが同じ版を出していることがあるので、もう一度確かめる
      - name: Check existing tags
        id: targets
        run: .github/scripts/image-targets.sh
      - uses: docker/setup-buildx-action@v4
        if: steps.targets.outputs.build == 'true'
      - uses: actions/download-artifact@v8
        if: steps.targets.outputs.build == 'true'
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true
      - name: Tag the multi-platform image
        if: steps.targets.outputs.build == 'true'
        env:
          TAGS: ${{ steps.targets.outputs.tags }}
          ARCHES: amd64 arm64
          VERSION: ${{ steps.targets.outputs.version }}
          REVISION: ${{ steps.targets.outputs.revision }}
        run: .github/scripts/image-merge.sh "$RUNNER_TEMP/digest"
      - name: Push git tag
        if: steps.targets.outputs.build == 'true'
        env:
          VERSION: ${{ steps.targets.outputs.version }}
          REVISION: ${{ steps.targets.outputs.revision }}
        run: |
          tag="v$VERSION"
          git fetch -q origin "refs/tags/$tag:refs/tags/$tag" 2> /dev/null || true
          if tagged="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              [ "$tagged" = "$REVISION" ] \
                  || echo "::warning::タグ $tag は別のコミット（$tagged）に付いています"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "seiran $VERSION" "$REVISION"
          git push -q origin "refs/tags/$tag"
          echo "版 $VERSION を push しました" >> "$GITHUB_STEP_SUMMARY"

  # ─── 告知: イメージを push した版を seiran のサーバーへ投稿する ───────────
  # 告知先はシークレット ANNOUNCE_TARGETS に「URL トークン」を1行1組で書く
  # （.github/scripts/announce.sh）。イメージは出た後なので、ここが失敗してもリリースは
  # 取り消さない（失敗はこのジョブの赤で分かる）。
  announce:
    name: Announce
    needs: image-publish
    # 検査ジョブがスキップされていても（版上げだけのコミット等）告知する。if に状態関数が
    # 無いと、needs のさらに上流にスキップがあるだけでこのジョブもスキップされる。
    if: >-
      !cancelled() &&
      needs.image-publish.result == 'success' &&
      needs.image-publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 前の版のタグとの差分を変更点として示すため
          fetch-tags: true
      - name: Post announcement
        env:
          ANNOUNCE_TARGETS: ${{ secrets.ANNOUNCE_TARGETS }}
          VERSION: ${{ needs.image-publish.outputs.version }}
        run: .github/scripts/announce.sh "$VERSION"
