name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── シークレット検出 ────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  # ─── Rust: 型チェック / Clippy / テスト ─────────────────────────────────
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `stable`任せだとRustリリースのたびにclippyの新規lintが追加され、
          # コード変更なしにCIが突然落ちることがある（実機確認: result_large_err
          # lintが新しいstableで有効化され既存コード6箇所が引っかかった）。
          # 明示的にバージョンを固定し、更新は意図した時にだけ行う。
          toolchain: "1.96.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # e2eジョブと依存クレートのビルド成果物を共有する（e2e側はsave-if:falseで
          # 読み取り専用にし、保存はこちらに一本化する。同一キーへの保存はGitHub
          # Actionsキャッシュの仕様上「先勝ち」で、両方保存にすると後発ジョブの
          # 保存が反映されず、キャッシュの中身がジョブ間で行ったり来たりする）。
          shared-key: "ci-rust"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Type check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: cargo test --workspace

  # ─── フロントエンド: 型チェック / ESLint ────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        # 配布するバンドルに入る本番依存だけを検査する。開発用依存（vite・vitest・eslint 等）は
        # ビルド・テスト時にしか動かず外部入力も渡らないので、その勧告で CI を止めない。
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm test

  # ─── ブラウザE2E: 実API + 隔離DB + 外部サービスstub ────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rustジョブと同じバージョンに固定する（上記コメント参照）。
          toolchain: "1.96.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust"
          save-if: "false" # 保存はrustジョブに一本化（上記コメント参照）
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: e2e
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build E2E Postgres image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.postgres
          tags: seiran-postgres:16-pgbigm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true # buildxのコンテナドライバはデフォルトでdockerデーモンに載せないため必須
      - name: DB integration tests
        # `crates/seiran-api/tests/*_integration.rs`（`#[ignore]`付き、実DBが必要）を、E2Eと同じ
        # 専用DBで実行する。ハーネスがマイグレーション適用・テストユーザー作成まで行う。
        env:
          POSTGRES_USER: seiran_e2e
          POSTGRES_PASSWORD: seiran_e2e
          POSTGRES_DB: seiran_e2e
          DB_HOST: localhost
          DB_PORT: "5433"
          LOCAL_DOMAIN: localhost
        run: |
          docker compose -f e2e/docker-compose.yml up -d --wait
          cargo test -p seiran-api --tests -- --ignored
      - name: Reset E2E database
        # E2E は空のDBから始める前提のため、結合テストで使ったDBを破棄する。
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
      - name: Build backend binary
        run: cargo build -p seiran-server
        # webServerのtimeout(600s)内でビルドが走る現状だと、ビルド失敗とサーバー起動
        # 失敗の切り分けがCIログ上でしづらい。ここで明示的にビルドしてから
        # npm testに進むことで、失敗ステップの意味を明確にする。
      - name: Run E2E
        working-directory: e2e
        run: npm test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ─── 公開イメージ: 検査と並行してビルドし、全部通ったら push ─────────────
  # main への push（と手動実行）のときだけ。同じ版のタグが両方のレジストリに既にあれば
  # ビルドしない。image-build は検査の結果を待たずにビルドしてキャッシュ（gha）に置くだけで、
  # push は image-publish が全ジョブ成功後に同じビルドをキャッシュから再現して行う
  # （キャッシュが消えていても作り直すだけで、検査を通っていないイメージが出ることはない）。
  # 必要なシークレット: DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（seiranorg へ push できるトークン）。
  # GHCR は GITHUB_TOKEN で push する。
  image-build:
    name: Image build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.targets.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing tags
        id: targets
        run: .github/scripts/image-targets.sh
      - uses: docker/setup-buildx-action@v4
        if: steps.targets.outputs.build == 'true'
      - name: Build (cache only)
        if: steps.targets.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/seiran/Dockerfile
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max

  image-publish:
    name: Image publish
    needs: [gitleaks, rust, frontend, e2e, image-build]
    if: needs.image-build.outputs.build == 'true'
    runs-on: ubuntu-latest
    # 同じ版を2つのコミットが同時に push しないよう直列にする（後発は下で既存と判定される）
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: write # git タグ v<版> の push
      packages: write # GHCR への push
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # image-build の後に別のコミットが同じ版を push していることがあるので、もう一度確かめる
      - name: Check existing tags
        id: targets
        run: .github/scripts/image-targets.sh
      - uses: docker/setup-buildx-action@v4
        if: steps.targets.outputs.build == 'true'
      - name: Push
        if: steps.targets.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/seiran/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.targets.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.targets.outputs.version }}
            org.opencontainers.image.revision=${{ steps.targets.outputs.revision }}
            org.opencontainers.image.source=https://github.com/seiran-sns/seiran
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=release-image
      - name: Push git tag
        if: steps.targets.outputs.build == 'true'
        env:
          VERSION: ${{ steps.targets.outputs.version }}
          REVISION: ${{ steps.targets.outputs.revision }}
        run: |
          tag="v$VERSION"
          git fetch -q origin "refs/tags/$tag:refs/tags/$tag" 2> /dev/null || true
          if tagged="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              [ "$tagged" = "$REVISION" ] \
                  || echo "::warning::タグ $tag は別のコミット（$tagged）に付いています"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "seiran $VERSION" "$REVISION"
          git push -q origin "refs/tags/$tag"
          echo "版 $VERSION を push しました" >> "$GITHUB_STEP_SUMMARY"
