name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─── シークレット検出 ────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  # ─── Rust: 型チェック / Clippy / テスト ─────────────────────────────────
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `stable`任せだとRustリリースのたびにclippyの新規lintが追加され、
          # コード変更なしにCIが突然落ちることがある（実機確認: result_large_err
          # lintが新しいstableで有効化され既存コード6箇所が引っかかった）。
          # 明示的にバージョンを固定し、更新は意図した時にだけ行う。
          toolchain: "1.96.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # e2eジョブと依存クレートのビルド成果物を共有する（e2e側はsave-if:falseで
          # 読み取り専用にし、保存はこちらに一本化する。同一キーへの保存はGitHub
          # Actionsキャッシュの仕様上「先勝ち」で、両方保存にすると後発ジョブの
          # 保存が反映されず、キャッシュの中身がジョブ間で行ったり来たりする）。
          shared-key: "ci-rust"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Type check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: cargo test --workspace

  # ─── フロントエンド: 型チェック / ESLint ────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          set +e
          output="$(npm audit --audit-level=high 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # GHSA-qwww-vcr4-c8h2（react-router、severity: high）のみ許容する。
          # 「unstable RSC APIsを使っている場合のみ影響」と勧告に明記されており、
          # 本アプリはdeclarative mode（<BrowserRouter>）のみでRSC不使用のため対象外。
          # 修正は8.3.0以降のみで、react-router-domパッケージ自体がv8で廃止
          # （React 19 / Node 22必須の`react-router`単体パッケージへの全面移行が必要）
          # なため、現時点では追随しない（issue #219）。
          unexpected="$(echo "$output" | grep -oE 'GHSA-[a-z0-9-]+' | sort -u | grep -v '^GHSA-qwww-vcr4-c8h2$' || true)"
          if [ -n "$unexpected" ]; then
            echo "許容リスト外の脆弱性が見つかりました:"
            echo "$unexpected"
            exit 1
          fi
          echo "既知の許容済み脆弱性（GHSA-qwww-vcr4-c8h2、本アプリのRSC不使用構成には非該当）のみ検出。CI続行。"
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm test

  # ─── ブラウザE2E: 実API + 隔離DB + 外部サービスstub ────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rustジョブと同じバージョンに固定する（上記コメント参照）。
          toolchain: "1.96.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust"
          save-if: "false" # 保存はrustジョブに一本化（上記コメント参照）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: e2e
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - name: Build E2E Postgres image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.postgres
          tags: seiran-postgres:16-pgbigm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true # buildxのコンテナドライバはデフォルトでdockerデーモンに載せないため必須
      - name: Build backend binary
        run: cargo build -p seiran-server
        # webServerのtimeout(600s)内でビルドが走る現状だと、ビルド失敗とサーバー起動
        # 失敗の切り分けがCIログ上でしづらい。ここで明示的にビルドしてから
        # npm testに進むことで、失敗ステップの意味を明確にする。
      - name: Run E2E
        working-directory: e2e
        run: npm test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
