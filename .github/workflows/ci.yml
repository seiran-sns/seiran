name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─── シークレット検出 ────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  # ─── Rust: 型チェック / Clippy / テスト ─────────────────────────────────
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Type check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: cargo test --workspace

  # ─── フロントエンド: 型チェック / ESLint ────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          set +e
          output="$(npm audit --audit-level=high 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # GHSA-qwww-vcr4-c8h2（react-router、severity: high）のみ許容する。
          # 「unstable RSC APIsを使っている場合のみ影響」と勧告に明記されており、
          # 本アプリはdeclarative mode（<BrowserRouter>）のみでRSC不使用のため対象外。
          # 修正は8.3.0以降のみで、react-router-domパッケージ自体がv8で廃止
          # （React 19 / Node 22必須の`react-router`単体パッケージへの全面移行が必要）
          # なため、現時点では追随しない（issue #219）。
          unexpected="$(echo "$output" | grep -oE 'GHSA-[a-z0-9-]+' | sort -u | grep -v '^GHSA-qwww-vcr4-c8h2$' || true)"
          if [ -n "$unexpected" ]; then
            echo "許容リスト外の脆弱性が見つかりました:"
            echo "$unexpected"
            exit 1
          fi
          echo "既知の許容済み脆弱性（GHSA-qwww-vcr4-c8h2、本アプリのRSC不使用構成には非該当）のみ検出。CI続行。"
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: npm test

  # ─── ブラウザE2E: 実API + 隔離DB + 外部サービスstub ────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npm test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
